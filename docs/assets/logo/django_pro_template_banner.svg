<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Django Pro Template — secure, production-ready Django backend foundation">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfaf8"/>
      <stop offset="60%" stop-color="#f6f4f0"/>
      <stop offset="100%" stop-color="#eeebe4"/>
    </linearGradient>
    <linearGradient id="rail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a68a5b" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#a68a5b"/>
      <stop offset="100%" stop-color="#8a7049"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#paper)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#ddd6c9"/>
  <rect x="0" y="299" width="1200" height="1" fill="#ddd6c9"/>

  <rect x="76" y="82" width="3" height="136" fill="url(#rail)"/>

  <text x="108" y="108" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#a68a5b" letter-spacing="8.5">DJANGO BACKEND TEMPLATE</text>

  <text x="105" y="180" font-family="Georgia,'Times New Roman',Times,serif" font-size="74" font-weight="400" fill="#18202f" letter-spacing="0.5">Django Pro Template</text>

  <text x="108" y="212" font-family="Georgia,'Times New Roman',Times,serif" font-size="17.5" font-style="italic" fill="#5d6474">Secure architecture · PostgreSQL · Docker-ready</text>

  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8a7049" letter-spacing="3">
    <rect x="108" y="238" width="86" height="26" fill="none" stroke="#ddd6c9"/>
    <text x="151" y="255" text-anchor="middle">PYTHON</text>
    <rect x="202" y="238" width="86" height="26" fill="none" stroke="#ddd6c9"/>
    <text x="245" y="255" text-anchor="middle">DJANGO</text>
    <rect x="296" y="238" width="118" height="26" fill="none" stroke="#ddd6c9"/>
    <text x="355" y="255" text-anchor="middle">POSTGRESQL</text>
    <rect x="422" y="238" width="86" height="26" fill="none" stroke="#ddd6c9"/>
    <text x="465" y="255" text-anchor="middle">DOCKER</text>
  </g>

  <circle cx="1092" cy="150" r="46" fill="none" stroke="#a68a5b" stroke-opacity="0.75" stroke-width="1.2"/>
  <circle cx="1092" cy="150" r="39" fill="none" stroke="#a68a5b" stroke-opacity="0.35" stroke-width="0.8"/>
  <text x="1092" y="160" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-size="30" fill="#a68a5b" letter-spacing="1">5.2</text>
  <text x="1092" y="222" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#9a9484" letter-spacing="3.5">MIT LICENSED</text>
</svg>
